{% extends "accounts/_narrow.html" %}
{% load i18n %}

{% block title %}{% translate "Create account" %}{% endblock %}

{% block card %}
  <h1>{% translate "Create account" %}</h1>
  <p>{% translate "You have been invited to watchit. Choose a username and a password." %}</p>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">{% translate "Create account" %}</button>
  </form>
{% endblock %}
