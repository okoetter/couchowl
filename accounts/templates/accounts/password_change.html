{% extends "accounts/_narrow.html" %}
{% load i18n %}

{% block title %}{% translate "Change password" %}{% endblock %}

{% block card %}
  <h1>{% translate "Change password" %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">{% translate "Change password" %}</button>
  </form>
  <a href="{% url 'accounts:profile' %}">{% translate "Back to profile" %}</a>
{% endblock %}
