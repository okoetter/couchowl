{% extends "admin/change_form.html" %}
{% load i18n %}

{% block form_top %}
  {% if invitation_url %}
    <fieldset class="module aligned">
      <div class="form-row">
        <label for="invitation-link">{% translate "Invitation link" %}:</label>
        <input id="invitation-link" type="text" readonly value="{{ invitation_url }}" size="80" onfocus="this.select()">
        <div class="help">{% translate "Send this link to the person you want to invite. It can only be used once." %}</div>
      </div>
    </fieldset>
  {% endif %}
  {{ block.super }}
{% endblock %}
