[project]
name = "watchit"
version = "0.1.0"
description = "Self-hosted watchlist for movies and TV shows, powered by TMDB"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "babel>=2.18.0",
    "django>=6.1.3",
    "django-axes==9.0.0",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "honcho>=2.0.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
# watchit is an application, not a library: don't build/install it as a package
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "--strict-markers -m 'not live and not e2e'"
markers = [
  "live: tests that call the real TMDB API (needs TMDB_API_TOKEN, run manually)",
  "e2e: browser end-to-end tests with Playwright",
]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["*/migrations/*"]
force-exclude = true  # also when pre-commit passes file names explicitly

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]  # hardcoded test passwords

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.4",
]
