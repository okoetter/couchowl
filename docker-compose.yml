# Couch Owl – Docker Compose
# 1. Copy .env.example to .env and adjust it (at least SECRET_KEY, SITE_URL, TMDB_API_TOKEN).
#    Full guide: docs/deployment.md
# 2. docker compose up -d
# 3. Open http://localhost:8000

services:
  couchowl:
    build: .
    image: couchowl:local
    container_name: couchowl
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      DEBUG: "False" # the container is always production
    ports:
      - "8000:8000"
    volumes:
      - couchowl-data:/data
      # Optional: nightly database copies into a host folder your backup already covers
      # (then set BACKUP_DIR=/backups in .env; the folder must be writable by uid 1000)
      # - /srv/backups/couchowl:/backups

  # Optional: PostgreSQL instead of SQLite. Uncomment, then set in .env:
  # DATABASE_URL=postgres://couchowl:change-me@db:5432/couchowl
  # db:
  #   image: postgres:18
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: couchowl
  #     POSTGRES_USER: couchowl
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - couchowl-db:/var/lib/postgresql

volumes:
  couchowl-data:
  # couchowl-db:
