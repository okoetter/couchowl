# watchit – Docker Compose
# 1. Copy .env.example to .env and adjust it (at least SECRET_KEY and ALLOWED_HOSTS).
# 2. docker compose up -d
# 3. Open http://localhost:8000

services:
  watchit:
    build: .
    image: watchit:local
    container_name: watchit
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      DEBUG: "False" # the container is always production
    ports:
      - "8000:8000"
    volumes:
      - watchit-data:/data
      # Optional: nightly database copies into a host folder your backup already covers
      # (then set BACKUP_DIR=/backups in .env; the folder must be writable by uid 1000)
      # - /volume1/backup/watchit:/backups

  # Optional: PostgreSQL instead of SQLite. Uncomment, then set in .env:
  # DATABASE_URL=postgres://watchit:change-me@db:5432/watchit
  # db:
  #   image: postgres:18
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: watchit
  #     POSTGRES_USER: watchit
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - watchit-db:/var/lib/postgresql

volumes:
  watchit-data:
  # watchit-db:
